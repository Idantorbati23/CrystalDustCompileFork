name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y wget curl unzip libarchive-tools

      - name: Install devkitPro Pacman Packages
        run: |
          dmpkg install gba-dev

      - name: Download and Install Poryscript
        run: |
          # Fetch the latest Linux release of poryscript (adjust tag/version if needed)
          PORY_VERSION="v3.2.5" # Update if your project requires a specific version
          curl -L -o poryscript.tar.gz "https://github.com/huderlem/poryscript/releases/download/${PORY_VERSION}/poryscript_${PORY_VERSION#v}_linux_amd64.tar.gz"
          
          # Extract and place it where your makefile/build system expects it
          tar -xzf poryscript.tar.gz
          chmod +x poryscript
          
          # If your Makefile expects poryscript in the root folder or a specific bin path:
          # (Move it to /usr/local/bin or keep it in the workspace root)
          mv poryscript /usr/local/bin/poryscript
          
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM

      - name: Run Build
        run: |
          make -j$(nproc)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
