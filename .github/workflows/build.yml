name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & devkitPro Pacman
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 unzip make libpng-dev libz-dev
          sudo curl -sSL https://apt.devkitpro.org/install-devkitpro-pacman | sudo bash
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -Syu --noconfirm gba-dev

      - name: Build Repository Tools & Set Permissions
        run: |
          chmod +x tools/poryscript/poryscript 2>/dev/null || chmod +x tools/poryscript 2>/dev/null || true
          make -C tools

      - name: Run Modern Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH
          make -j$(nproc) modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
