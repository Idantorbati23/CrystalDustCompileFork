name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg git gcc g++

      - name: Install devkitPro Pacman
        run: |
          PACMAN_URL=$(curl -s https://api.github.com/repos/devkitPro/pacman/releases/latest | grep "browser_download_url.*amd64\.deb" | cut -d '"' -f 4)
          curl -L -A "Mozilla/5.0" -o devkitpro-pacman.amd64.deb "$PACMAN_URL"
          sudo dpkg -i devkitpro-pacman.amd64.deb

      - name: Install GBA Development Tools
        run: |
          sudo dkp-pacman -Syu --noconfirm gba-dev

      - name: Download and Install Poryscript
        run: |
          PORY_VERSION="v3.2.5"
          curl -L -o poryscript.tar.gz "https://github.com/huderlem/poryscript/releases/download/${PORY_VERSION}/poryscript_${PORY_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf poryscript.tar.gz
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript

      - name: Setup agbcc and Build Tools
        run: |
          # Create symbolic alias in case the Makefile explicitly calls make-modern or modern make binaries
          sudo ln -sf /usr/bin/make /usr/local/bin/make-modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM

      - name: Run Build
        run: |
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
