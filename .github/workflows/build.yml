name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 dirmngr

      - name: Install devkitPro Pacman Manually
        run: |
          # Download devkitPro pubkey directly from GitHub to bypass Cloudflare 403 blocks on apt.devkitpro.org
          sudo wget -O /usr/share/keyrings/devkitpro-pub.gpg https://raw.githubusercontent.com/devkitPro/pacman/master/etc/pacman.d/devkitpro.gpg
          echo "deb [signed-by=/usr/share/keyrings/devkitpro-pub.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          
          # Download and unpack devkitpro-pacman package
          apt-get download devkitpro-pacman
          sudo dpkg --unpack devkitpro-pacman_*.deb || true
          
          # Set up gnupg home and import the key manually
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo chmod 700 /opt/devkitpro/pacman/etc/pacman.d/gnupg
          sudo gpg --homedir /opt/devkitpro/pacman/etc/pacman.d/gnupg --batch --import /usr/share/keyrings/devkitpro-pub.gpg || true
          sudo gpg --homedir /opt/devkitpro/pacman/etc/pacman.d/gnupg --batch --update-trustdb || true

      - name: Install GBA Development Tools
        run: |
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -Syu --noconfirm gba-dev

      - name: Download and Install Poryscript
        run: |
          python3 -c '
          import urllib.request, json, zipfile, os
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request("https://api.github.com/repos/huderlem/poryscript/releases/latest", headers=headers)
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower() and a["name"].endswith(".zip"))
          urllib.request.urlretrieve(url, "poryscript.zip")
          with zipfile.ZipFile("poryscript.zip", "r") as z:
              z.extractall(".")
          '
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Modern Build
        run: |
          sudo ln -sf /usr/bin/make /usr/local/bin/make-modern
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
