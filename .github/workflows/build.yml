name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libarchive-tools build-essential

      - name: Install devkitPro Pacman
        run: |
          wget https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman.amd64.deb
          sudo dpkg -i devkitpro-pacman.amd64.deb

      - name: Install GBA Development Tools
        run: |
          sudo dkp-pacman -Syu --noconfirm gba-dev

      - name: Download and Install Poryscript
        run: |
          PORY_VERSION="v3.2.5"
          curl -L -o poryscript.tar.gz "https://github.com/huderlem/poryscript/releases/download/${PORY_VERSION}/poryscript_${PORY_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf poryscript.tar.gz
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript

      - name: Run Build
        run: |
          make -j$(nproc)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
