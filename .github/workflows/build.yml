name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 unzip

      - name: Setup devkitPro Environment & Pacman
        run: |
          # 1. Download devkitpro-pacman directly from GitHub releases with fallback URL
          PACMAN_DEB_URL=$(curl -sSL -A "Mozilla/5.0" https://api.github.com/repos/devkitPro/pacman/releases/latest | grep -o '"browser_download_url": "[^"]*amd64\.deb"' | head -n 1 | cut -d'"' -f4)
          if [ -z "$PACMAN_DEB_URL" ]; then
            PACMAN_DEB_URL="https://github.com/devkitPro/pacman/releases/download/v6.0.1-2/devkitpro-pacman_6.0.1-2_amd64.deb"
          fi
          curl -sSL -A "Mozilla/5.0" -o devkitpro-pacman.deb "$PACMAN_DEB_URL"
          sudo dpkg --unpack devkitpro-pacman.deb || true

          # 2. Establish required directories and lenient pacman.conf to bypass signature blocks
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d
          sudo mkdir -p /opt/devkitpro/pacman/var/lib/pacman
          sudo mkdir -p /opt/devkitpro/pacman/var/log

          sudo tee /opt/devkitpro/pacman/etc/pacman.conf > /dev/null << 'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = auto
          CheckSpace
          SigLevel    = Never

          [dkp-libs]
          Server = https://pkg.devkitpro.org

          [dkp-linux]
          Server = https://pkg.devkitpro.org
          EOF

          # 3. Manually create the dkp-pacman symlink pointing to the unpacked binary
          sudo ln -sf /opt/devkitpro/pacman/bin/pacman /usr/bin/dkp-pacman

      - name: Install GBA Development Tools via dkp-pacman
        run: |
          sudo dkp-pacman --config /opt/devkitpro/pacman/etc/pacman.conf -Sy --noconfirm
          sudo dkp-pacman --config /opt/devkitpro/pacman/etc/pacman.conf -Syu --noconfirm gba-dev || true

      - name: Install Poryscript via GitHub Releases
        run: |
          python3 -c '
          import urllib.request, json, zipfile, os
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          try:
              req = urllib.request.Request("https://api.github.com/repos/huderlem/poryscript/releases/latest", headers=headers)
              data = json.loads(urllib.request.urlopen(req).read().decode())
              url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower() and a["name"].endswith(".zip"))
          except Exception:
              url = "https://github.com/huderlem/poryscript/releases/download/v3.2.5/poryscript_linux_amd64.zip"
          urllib.request.urlretrieve(url, "poryscript.zip")
          with zipfile.ZipFile("poryscript.zip", "r") as z:
              z.extractall(".")
          '
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Modern Build
        run: |
          sudo ln -sf /usr/bin/make /usr/local/bin/make-modern
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
