name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget build-essential python3 unzip make libpng-dev libz-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build Repository Tools & Set Permissions
        run: |
          chmod +x tools/poryscript/poryscript 2>/dev/null || chmod +x tools/poryscript 2>/dev/null || true
          make -C tools

      - name: Run Modern Build
        run: |
          make -j$(nproc) modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
