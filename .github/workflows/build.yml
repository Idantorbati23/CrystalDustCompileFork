name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 unzip make libpng-dev libz-dev

      - name: Install devkitARM Manually
        run: |
          sudo mkdir -p /opt/devkitpro/devkitARM
          wget -q https://github.com/devkitPro/devkitarm-r1/releases/download/release_53/devkitARM-r53-linux.tar.bz2 -O devkitARM.tar.bz2 || \
          wget -q https://github.com/devkitPro/devkitarm-r1/releases/latest/download/devkitARM-linux.tar.bz2 -O devkitARM.tar.bz2 || \
          curl -L -s https://github.com/devkitPro/devkitarm-r1/releases/download/release_53/devkitARM-r53-linux.tar.bz2 -o devkitARM.tar.bz2
          sudo tar -C /opt/devkitpro/devkitARM --strip-components=1 -xjf devkitARM.tar.bz2 || sudo tar -C /opt/devkitpro/devkitARM -xjf devkitARM.tar.bz2

      - name: Build Repository Tools & Set Permissions
        run: |
          chmod +x tools/poryscript/poryscript 2>/dev/null || chmod +x tools/poryscript 2>/dev/null || true
          make -C tools

      - name: Run Modern Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH
          make -j$(nproc) modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
