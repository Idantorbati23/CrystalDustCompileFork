name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y curl python3 make git build-essential unzip

      - name: Install Poryscript via GitHub Releases
        run: |
          python3 -c '
          import urllib.request, json, zipfile, os, shutil
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          try:
              req = urllib.request.Request("https://api.github.com/repos/huderlem/poryscript/releases/latest", headers=headers)
              data = json.loads(urllib.request.urlopen(req).read().decode())
              url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower() and a["name"].endswith(".zip"))
          except Exception:
              url = "https://github.com/huderlem/poryscript/releases/download/v3.2.5/poryscript_linux_amd64.zip"
          urllib.request.urlretrieve(url, "poryscript.zip")
          with zipfile.ZipFile("poryscript.zip", "r") as z:
              z.extractall("pory_extracted")
          
          found = False
          for root, dirs, files in os.walk("pory_extracted"):
              for f in files:
                  if "poryscript" in f.lower() and not f.endswith(".zip"):
                      src = os.path.join(root, f)
                      shutil.move(src, "poryscript")
                      found = True
                      break
              if found:
                  break
          if not found:
              raise FileNotFoundError("Could not locate poryscript binary in extracted archive")
          '
          chmod +x poryscript
          mv poryscript /usr/local/bin/poryscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Modern Build
        run: |
          ln -sf /usr/bin/make /usr/local/bin/make-modern
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
