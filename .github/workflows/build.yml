name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget build-essential python3 unzip make libpng-dev libz-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fix missing cstdint in all json11.cpp files
        run: |
          find . -name "json11.cpp" | while read file; do
            echo "Patching $file"
            sed -i '1i #include <cstdint>' "$file"
          done

      - name: Set Permissions for Poryscript Files
        run: |
          chmod +x tools/poryscript/poryscript 2>/dev/null || true

      - name: Compile agbcc and Repository Tools
        run: |
          # Build agbcc explicitly if a build script or makefile exists inside it
          if [ -f "tools/agbcc/build.sh" ]; then
            cd tools/agbcc && ./build.sh && cd ../..
          elif [ -f "tools/agbcc/Makefile" ]; then
            make -C tools/agbcc
          fi
          make tools

      - name: Run Modern Build with Correct Include Paths & Sysroot
        run: |
          export CC=arm-none-eabi-gcc
          export CFLAGS="-isystem /usr/arm-none-eabi/include -isystem /usr/lib/gcc/arm-none-eabi/14.2.1/include"
          export CPPFLAGS="-isystem /usr/arm-none-eabi/include -isystem /usr/lib/gcc/arm-none-eabi/14.2.1/include"
          make -j$(nproc) modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
