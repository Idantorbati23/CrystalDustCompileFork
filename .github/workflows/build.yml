name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget build-essential python3 unzip make libpng-dev libz-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fix missing cstdint in all json11.cpp files
        run: |
          find . -name "json11.cpp" | while read file; do
            echo "Patching $file"
            sed -i '1i #include <cstdint>' "$file"
          done

      - name: Set Permissions for Poryscript Files
        run: |
          chmod +x tools/poryscript/poryscript 2>/dev/null || true

      - name: Clone, Build, and Install agbcc
        run: |
          mkdir -p tools/agbcc
          if [ ! -f "tools/agbcc/build.sh" ]; then
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          fi
          
          cd tools/agbcc
          ./build.sh
          # Use agbcc's official installer to configure binaries and include paths
          ./install.sh ../../
          cd ../..
          make tools

      - name: Run Sequential Modern Build
        run: |
          export CC=arm-none-eabi-gcc
          make modern

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
