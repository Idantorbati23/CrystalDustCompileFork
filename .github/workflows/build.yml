name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 unzip make

      - name: Setup devkitARM Toolchain Manually
        run: |
          # Create devkitPro directory structure
          sudo mkdir -p /opt/devkitpro/devkitARM
          sudo mkdir -p /opt/devkitpro/tools

          # Download and extract devkitARM release directly from GitHub (bypassing pacman & Cloudflare 403s)
          echo "Downloading devkitARM release..."
          DEVKITARM_URL=$(curl -sSL -A "Mozilla/5.0" https://api.github.com/repos/devkitPro/devkitarm-r1/releases/latest | grep -o '"browser_download_url": "[^"]*linux\.tar\.xz"' | head -n 1 | cut -d'"' -f4)
          if [ -z "$DEVKITARM_URL" ]; then
            DEVKITARM_URL="https://github.com/devkitPro/devkitarm-r1/releases/download/release_54/devkitARM-r54-linux.tar.bz2"
          fi
          
          curl -sSL -A "Mozilla/5.0" -o devkitarm.archive "$DEVKITARM_URL"
          sudo tar -xf devkitarm.archive -C /opt/devkitpro/ || sudo bsdtar -xf devkitarm.archive -C /opt/devkitpro/

          # Ensure correct permissions
          sudo chmod -R +x /opt/devkitpro/devkitARM/bin

      - name: Install Poryscript via GitHub Releases
        run: |
          python3 -c '
          import urllib.request, json, zipfile, os
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          try:
              req = urllib.request.Request("https://api.github.com/repos/huderlem/poryscript/releases/latest", headers=headers)
              data = json.loads(urllib.request.urlopen(req).read().decode())
              url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower() and a["name"].endswith(".zip"))
          except Exception:
              url = "https://github.com/huderlem/poryscript/releases/download/v3.2.5/poryscript_linux_amd64.zip"
          urllib.request.urlretrieve(url, "poryscript.zip")
          with zipfile.ZipFile("poryscript.zip", "r") as z:
              z.extractall(".")
          '
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Modern Build
        run: |
          sudo ln -sf /usr/bin/make /usr/local/bin/make-modern
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
