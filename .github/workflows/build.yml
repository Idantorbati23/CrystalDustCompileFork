name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget libarchive-tools build-essential gnupg python3 dirmngr

      - name: Install devkitPro Pacman Manually
        run: |
          # Download and unpack devkitpro-pacman
          apt-get download devkitpro-pacman
          sudo dpkg --unpack devkitpro-pacman_*.deb || true
          
          # Create required directory structure
          sudo mkdir -p /opt/devkitpro/pacman/etc/pacman.d
          sudo mkdir -p /opt/devkitpro/pacman/var/lib/pacman
          sudo mkdir -p /opt/devkitpro/pacman/var/log
          
          # Write out a lenient pacman.conf with signature verification disabled for CI
          sudo tee /opt/devkitpro/pacman/etc/pacman.conf > /dev/null << 'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = auto
          CheckSpace
          SigLevel    = Never

          [dkp-libs]
          Server = https://pkg.devkitpro.org

          [dkp-linux]
          Server = https://pkg.devkitpro.org
          EOF

      - name: Install GBA Development Tools
        run: |
          sudo dkp-pacman --config /opt/devkitpro/pacman/etc/pacman.conf -Sy --noconfirm
          sudo dkp-pacman --config /opt/devkitpro/pacman/etc/pacman.conf -Syu --noconfirm gba-dev

      - name: Download and Install Poryscript
        run: |
          python3 -c '
          import urllib.request, json, zipfile, os
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request("https://api.github.com/repos/huderlem/poryscript/releases/latest", headers=headers)
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower() and a["name"].endswith(".zip"))
          urllib.request.urlretrieve(url, "poryscript.zip")
          with zipfile.ZipFile("poryscript.zip", "r") as z:
              z.extractall(".")
          '
          chmod +x poryscript
          sudo mv poryscript /usr/local/bin/poryscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Modern Build
        run: |
          sudo ln -sf /usr/bin/make /usr/local/bin/make-modern
          make -j$(nproc) modern
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:/usr/local/bin:$PATH

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: |
            *.gba
            build/*.gba
